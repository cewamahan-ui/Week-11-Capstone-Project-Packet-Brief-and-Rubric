[pytest]
minversion = 7.0
addopts = -ra --strict-markers -m "not integration"
testpaths = tests
markers =
    unit: unit tests for core business logic (default tier)
    integration: integration tests using the in-process API client
    perf: performance measurement tests
    security: security smoke tests (redaction, secrets, tokens)
    slow: long running tests
    golden: golden fixture comparison tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
python_files = test_*.py
python_classes = Test*
python_functions = test_*