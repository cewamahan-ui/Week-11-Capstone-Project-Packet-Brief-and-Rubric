# CI Configuration for AfyaPlus Module 4 Capstone

name: "AfyaPlus Capstone CI"

on:
  push:
    branches: [ main, feature/module4-capstone ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12, 3.13]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q --tb=short
        env:
          AFYA_TOKEN_SECRET: testsecret
          AFYA_MCP_URL: ""
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.python-version }}
          path: tests/

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run integration tests
        run: pytest -m integration -q --tb=short
        env:
          AFYA_TOKEN_SECRET: testsecret
          AFYA_MCP_URL: ""
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: tests/

  security-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run security smoke tests
        run: pytest tests/test_security_smoke.py -v --tb=short
        env:
          AFYA_TOKEN_SECRET: testsecret
      - name: Upload security test results
        uses: actions/upload-artifact@v4
        with:
          name: security-smoke-results
          path: tests/

  perf-measurement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Measure performance
        run: python scripts/measure_perf.py
        env:
          AFYA_TOKEN_SECRET: testsecret
          AFYA_MCP_URL: ""
      - name: Upload perf metrics
        uses: actions/upload-artifact@v4
        with:
          name: perf-metrics
          path: perf_stub.json
          retention-days: 30

  quality-gate:
    needs: [unit-tests, integration-tests, security-smoke, perf-measurement]
    runs-on: ubuntu-latest
    steps:
      - name: Quality gate
        run: |
          echo "All CI jobs must pass for merge approval."