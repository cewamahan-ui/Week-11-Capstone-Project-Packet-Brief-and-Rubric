name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Unit tier (default) - pytest -q
        run: pytest -q

      - name: Integration tier
        run: pytest -m integration -q

      - name: Golden-set evaluation (prints EVAL SCORE into the logs)
        run: python scripts/eval_score.py

      - name: End-to-end pipeline smoke
        run: python -m src.afyaplus.main

      - name: Performance measurement
        run: python scripts/measure_perf.py
